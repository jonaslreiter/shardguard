[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-slurm"
version = "0.1.0"
description = "Keep a Slurm job within the GPU shards and the memory it was allocated"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jonas Reiter" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Distributed Computing",
]

[project.urls]
Repository = "https://github.com/jonaslreiter/safe-slurm"

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["safe_slurm"]
py-modules = ["safe_memory", "safe_shards"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
target-version = ["py310"]

[tool.isort]
profile = "black"
